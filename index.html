<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Football Career SIM 3D</title>

<style>

*{box-sizing:border-box}

body{margin:0;overflow:hidden;background:#111;font-family:Arial;color:white}

canvas{display:block}

#ui{position:fixed;top:12px;left:0;width:100%;text-align:center;z-index:5;pointer-events:none}

#score{background:#111c;padding:10px 18px;border-radius:12px;font-size:20px;display:inline-block}

#help{font-size:12px;margin-top:8px;color:white}

#controls{position:fixed;bottom:25px;width:100%;display:flex;justify-content:space-between;padding:0 20px;z-index:10}

#joy{width:120px;height:120px;border-radius:50%;background:#ffffff33;border:2px solid #ffffff77;position:relative;touch-action:none}

#knob{width:48px;height:48px;border-radius:50%;background:#ffffffaa;position:absolute;left:34px;top:34px}

#buttons{display:flex;align-items:end;gap:12px}

.btn{border:0;border-radius:50%;width:76px;height:76px;background:#ffcc33;color:#111;font-weight:bold;font-size:16px;touch-action:none}

#sprint{background:#77dd99}

</style>

</head>

<body>

<div id="ui">

  <div id="score">YOU 0 - 0 AI | 00:00</div>

  <div id="help">Move with joystick • SHOOT to kick • SPRINT to run</div>

</div>

<div id="controls">

  <div id="joy"><div id="knob"></div></div>

  <div id="buttons">

    <button class="btn" id="sprint">SPRINT</button>

    <button class="btn" id="shoot">SHOOT</button>

  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x87ceeb);

scene.fog=new THREE.Fog(0x87ceeb,35,100);

const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,200);

camera.position.set(0,12,16);

const renderer=new THREE.WebGLRenderer({antialias:true});

renderer.setSize(innerWidth,innerHeight);

renderer.setPixelRatio(Math.min(devicePixelRatio,2));

document.body.insertBefore(renderer.domElement,document.body.firstChild);

scene.add(new THREE.HemisphereLight(0xffffff,0x448844,2));

const sun=new THREE.DirectionalLight(0xffffff,2);

sun.position.set(10,20,10);

scene.add(sun);

const field=new THREE.Mesh(

 new THREE.PlaneGeometry(24,40),

 new THREE.MeshLambertMaterial({color:0x268c43})

);

field.rotation.x=-Math.PI/2;

scene.add(field);

const lines=new THREE.Group();

const white=new THREE.MeshBasicMaterial({color:0xffffff});

function line(x1,z1,x2,z2){

 const dx=x2-x1,dz=z2-z1;

 const mesh=new THREE.Mesh(new THREE.BoxGeometry(Math.sqrt(dx*dx+dz*dz),.025,.08),white);

 mesh.position.set((x1+x2)/2,.03,(z1+z2)/2);

 mesh.rotation.y=-Math.atan2(dz,dx);

 lines.add(mesh);

}

line(-12,-20,12,-20);line(-12,20,12,20);

line(-12,-20,-12,20);line(12,-20,12,20);

line(-12,0,12,0);

const circle=new THREE.Mesh(new THREE.RingGeometry(3.9,4,.8,64),white);

circle.rotation.x=-Math.PI/2;

circle.position.y=.04;

scene.add(circle);

function box(x,z,w,d){

 const m=new THREE.Mesh(new THREE.BoxGeometry(w,.03,d),white);

 m.position.set(x,.04,z);

 scene.add(m);

}

box(0,-16,12,8);box(0,16,12,8);

function makeGoal(z){

 const g=new THREE.Group();

 const mat=new THREE.MeshBasicMaterial({color:0xffffff});

 for(const [x,y] of [[-3,0],[3,0]]){

  const p=new THREE.Mesh(new THREE.BoxGeometry(.15,3,.15),mat);

  p.position.set(x,1.5,0);g.add(p);

 }

 const cross=new THREE.Mesh(new THREE.BoxGeometry(6,.15,.15),mat);

 cross.position.y=3;g.add(cross);

 g.position.z=z;

 scene.add(g);

}

makeGoal(-20);makeGoal(20);

function player(color,x,z){

 const group=new THREE.Group();

 const body=new THREE.Mesh(new THREE.CylinderGeometry(.35,.45,1.2,12),new THREE.MeshLambertMaterial({color}));

 body.position.y=1.1;group.add(body);

 const head=new THREE.Mesh(new THREE.SphereGeometry(.25,12,12),new THREE.MeshLambertMaterial({color:0xffcc99}));

 head.position.y=1.85;group.add(head);

 const legmat=new THREE.MeshLambertMaterial({color:0x222222});

 for(let s of [-1,1]){

  const leg=new THREE.Mesh(new THREE.BoxGeometry(.18,.65,.18),legmat);

  leg.position.set(s*.17,.35,0);group.add(leg);

 }

 group.position.set(x,0,z);

 scene.add(group);

 return group;

}

const me=player(0x1769ff,0,8);

const enemy=player(0xff3333,0,-8);

const teammate=player(0x1769ff,-5,3);

const enemy2=player(0xff3333,5,-3);

const ball=new THREE.Mesh(new THREE.SphereGeometry(.25,20,20),new THREE.MeshLambertMaterial({color:0xffffff}));

ball.position.set(0,.25,6);

scene.add(ball);

let vx=0,vz=0;

let joyX=0,joyY=0;

let isSprint=false;

let goals=0,aiGoals=0,time=0;

let last=performance.now();

const score=document.getElementById("score");

function updateScore(){

 score.textContent="YOU "+goals+" - "+aiGoals+" AI | "+Math.floor(time/60).toString().padStart(2,"0")+":"+Math.floor(time%60).toString().padStart(2,"0");

}

const joy=document.getElementById("joy");

const knob=document.getElementById("knob");

let active=false;

function moveJoy(e){

 const r=joy.getBoundingClientRect();

 let x=e.clientX-r.left-r.width/2;

 let y=e.clientY-r.top-r.height/2;

 const max=36;

 const len=Math.hypot(x,y);

 if(len>max){x*=max/len;y*=max/len;}

 joyX=x/max;

 joyY=y/max;

 knob.style.left=(34+x)+"px";

 knob.style.top=(34+y)+"px";

}

joy.addEventListener("pointerdown",e=>{

 active=true;joy.setPointerCapture(e.pointerId);moveJoy(e);

});

joy.addEventListener("pointermove",e=>{if(active)moveJoy(e)});

joy.addEventListener("pointerup",()=>{

 active=false;joyX=joyY=0;knob.style.left="34px";knob.style.top="34px";

});

joy.addEventListener("pointercancel",()=>{

 active=false;joyX=joyY=0;knob.style.left="34px";knob.style.top="34px";

});

document.getElementById("sprint").addEventListener("pointerdown",()=>isSprint=true);

document.getElementById("sprint").addEventListener("pointerup",()=>isSprint=false);

document.getElementById("sprint").addEventListener("pointercancel",()=>isSprint=false);

document.getElementById("sprint").addEventListener("pointerleave",()=>isSprint=false);

function shoot(){

 const distance=me.position.distanceTo(ball.position);

 if(distance<2.2){

  const dir=new THREE.Vector3(0,0,-1);

  if(Math.abs(joyX)+Math.abs(joyY)>.1){

   dir.set(joyX,0,-joyY).normalize();

  }

  vx=dir.x*9;

  vz=dir.z*14;

  ball.position.y=.35;

 }

}

document.getElementById("shoot").addEventListener("pointerdown",shoot);

function resetBall(){

 ball.position.set(0,.25,0);

 vx=0;vz=0;

 me.position.set(0,0,8);

 enemy.position.set(0,0,-8);

}

function animate(now){

 requestAnimationFrame(animate);

 let dt=Math.min((now-last)/1000,.05);

 last=now;time+=dt;

 const speed=isSprint?9:5;

 me.position.x+=joyX*speed*dt;

 me.position.z+=joyY*speed*dt;

 me.position.x=Math.max(-11,Math.min(11,me.position.x));

 me.position.z=Math.max(-19,Math.min(19,me.position.z));

 const dist=me.position.distanceTo(ball.position);

 if(dist<1.4 && Math.abs(vx)+Math.abs(vz)<2){

  ball.position.x=me.position.x;

  ball.position.z=me.position.z-1;

 }

 ball.position.x+=vx*dt;

 ball.position.z+=vz*dt;

 vx*=.985;vz*=.985;

 if(ball.position.y<.25)ball.position.y=.25;

 if(Math.abs(ball.position.x)>11)vx*=-.6;

 if(Math.abs(ball.position.z)>20){

  if(ball.position.z<-20 && Math.abs(ball.position.x)<3){

   goals++;resetBall();

  }else if(ball.position.z>20 && Math.abs(ball.position.x)<3){

   aiGoals++;resetBall();

  }else vz*=-.6;

 }

 // Simple opponent pursuit

 const dx=ball.position.x-enemy.position.x;

 const dz=ball.position.z-enemy.position.z;

 enemy.position.x+=dx*.7*dt;

 enemy.position.z+=dz*.7*dt;

 enemy.position.x=Math.max(-10,Math.min(10,enemy.position.x));

 enemy.position.z=Math.max(-19,Math.min(19,enemy.position.z));

 // Camera follows player

 camera.position.x=me.position.x*.6;

 camera.position.z=me.position.z+12;

 camera.position.y=13;

 camera.lookAt(me.position.x,0,me.position.z-3);

 ball.rotation.x+=vz*dt*2;

 ball.rotation.z+=vx*dt*2;

 updateScore();

 renderer.render(scene,camera);

}

requestAnimationFrame(animate);

window.addEventListener("resize",()=>{

 camera.aspect=innerWidth/innerHeight;

 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);

});

</script>

</body>

</html>
