!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1,user-scalable=no">

<title>Football 3D</title>

<style>

*{box-sizing:border-box}

body{margin:0;overflow:hidden;background:#70b8e5;font-family:Arial;touch-action:none}

canvas{display:block}

button{color:white;border:2px solid #ffffff80;background:#ffffff30;font-weight:bold;border-radius:50%;touch-action:none}

#hud{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#101820d9;color:white;padding:10px 22px;border-radius:14px;text-align:center;z-index:3;font-weight:bold;min-width:170px}

#controls{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 15px;z-index:5}

#stick{width:115px;height:115px;border:2px solid #ffffff80;border-radius:50%;background:#ffffff20;position:relative}

#knob{width:50px;height:50px;border-radius:50%;background:#ffffff90;position:absolute;left:30px;top:30px}

#actions{display:flex;align-items:end;gap:9px}

.btn{width:68px;height:68px;font-size:11px}

#shoot{width:88px;height:88px;background:#ff980080}

#loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:white;font-weight:bold;z-index:10}

</style>

</head>

<body>

<div id="loading">Loading Football 3D...</div>

<div id="hud">

⚽ <span id="score">0 - 0</span><br>

<span id="timer">00:00</span><br>

<small id="message">READY</small>

</div>

<div id="controls">

<div id="stick"><div id="knob"></div></div>

<div id="actions">

<button class="btn" id="sprint">SPRINT</button>

<button class="btn" id="pass">PASS</button>

<button class="btn" id="shoot">SHOOT</button>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x87ceeb);

scene.fog=new THREE.Fog(0x87ceeb,100,210);

const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,300);

const renderer=new THREE.WebGLRenderer({antialias:true});

renderer.setSize(innerWidth,innerHeight);

renderer.setPixelRatio(Math.min(devicePixelRatio,2));

renderer.shadowMap.enabled=true;

document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x365b30,2));

const sun=new THREE.DirectionalLight(0xffffff,2);

sun.position.set(-30,60,30);

sun.castShadow=true;

scene.add(sun);

// FIELD

const field=new THREE.Mesh(

new THREE.PlaneGeometry(60,110),

new THREE.MeshStandardMaterial({color:0x238a38})

);

field.rotation.x=-Math.PI/2;

field.receiveShadow=true;

scene.add(field);

// Grass stripes

for(let z=-50;z<50;z+=10){

const stripe=new THREE.Mesh(

new THREE.PlaneGeometry(60,10),

new THREE.MeshStandardMaterial({color:(Math.floor((z+50)/10)%2)?0x258e3d:0x19752e})

);

stripe.rotation.x=-Math.PI/2;

stripe.position.set(0,.01,z+5);

scene.add(stripe);

}

// Lines

const white=new THREE.LineBasicMaterial({color:0xffffff});

function line(x1,z1,x2,z2){

const g=new THREE.BufferGeometry().setFromPoints([

new THREE.Vector3(x1,.08,z1),

new THREE.Vector3(x2,.08,z2)

]);

scene.add(new THREE.Line(g,white));

}

line(-30,-55,30,-55);

line(-30,55,30,55);

line(-30,-55,-30,55);

line(30,-55,30,55);

line(-30,0,30,0);

const center=new THREE.Mesh(new THREE.RingGeometry(9.9,10,64),

new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide}));

center.rotation.x=-Math.PI/2;

center.position.y=.08;

scene.add(center);

// BOXES

line(-15,-55,15,-55);

line(-15,-55,-15,-35);

line(15,-55,15,-35);

line(-15,-35,15,-35);

line(-15,55,15,55);

line(-15,55,-15,35);

line(15,55,15,35);

line(-15,35,15,35);

// Goals

function buildGoal(z){

const mat=new THREE.MeshStandardMaterial({color:0xffffff});

function bar(x,y,z,w,h,d){

const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);

m.position.set(x,y,z);

scene.add(m);

}

bar(-7,2,z,.2,4,.2);

bar(7,2,z,.2,4,.2);

bar(0,4,z,14,.2,.2);

}

buildGoal(-55);

buildGoal(55);

// Stadium

const standMat=new THREE.MeshStandardMaterial({color:0x42566b});

function stand(w,h,d,x,y,z){

const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),standMat);

m.position.set(x,y,z);

scene.add(m);

}

stand(70,10,8,0,5,-67);

stand(70,10,8,0,5,67);

stand(8,10,120,-37,5,0);

stand(8,10,120,37,5,0);

// PLAYER CONSTRUCTION

function createPlayer(color,skinColor=0xd5a077){

const p=new THREE.Group();

const shirt=new THREE.MeshStandardMaterial({color});

const shorts=new THREE.MeshStandardMaterial({color:0x172544});

const skin=new THREE.MeshStandardMaterial({color:skinColor});

const socks=new THREE.MeshStandardMaterial({color:0xffffff});

const shoes=new THREE.MeshStandardMaterial({color:0x111111});

function add(geo,mat,x,y,z){

const m=new THREE.Mesh(geo,mat);

m.position.set(x,y,z);

m.castShadow=true;

p.add(m);

return m;

}

add(new THREE.CylinderGeometry(.5,.65,1.35,12),shirt,0,2.35,0);

add(new THREE.SphereGeometry(.38,16,16),skin,0,3.35,0);

add(new THREE.CylinderGeometry(.2,.2,.25,10),skin,0,3.12,0);

add(new THREE.BoxGeometry(1,.55,.65),shorts,0,1.55,0);

const arms=[];

arms.push(add(new THREE.CylinderGeometry(.14,.18,.85,10),skin,-.7,2.4,0));

arms.push(add(new THREE.CylinderGeometry(.14,.18,.85,10),skin,.7,2.4,0));

arms[0].rotation.z=-.2;

arms[1].rotation.z=.2;

const legs=[];

legs.push(add(new THREE.CylinderGeometry(.18,.17,.9,10),skin,-.28,.85,0));

legs.push(add(new THREE.CylinderGeometry(.18,.17,.9,10),skin,.28,.85,0));

add(new THREE.CylinderGeometry(.17,.17,.4,10),socks,-.28,.35,0);

add(new THREE.CylinderGeometry(.17,.17,.4,10),socks,.28,.35,0);

add(new THREE.BoxGeometry(.4,.2,.55),shoes,-.28,.15,-.12);

add(new THREE.BoxGeometry(.4,.2,.55),shoes,.28,.15,-.12);

return {group:p,legs,arms};

}

const playerObj=createPlayer(0x1682ff);

const player=playerObj.group;

scene.add(player);

// OPPONENTS

const opponents=[];

for(let i=0;i<4;i++){

const o=createPlayer(0xe52828);

o.group.position.set((i%2?12:-12),0,-15-i*8);

scene.add(o.group);

opponents.push(o);

}

// GOALKEEPER

const keeperObj=createPlayer(0xffd500);

const keeper=keeperObj.group;

keeper.position.set(0,0,-49);

scene.add(keeper);

// BALL

const ball=new THREE.Mesh(

new THREE.SphereGeometry(.5,24,24),

new THREE.MeshStandardMaterial({color:0xffffff})

);

ball.castShadow=true;

scene.add(ball);

// Ball black spots

for(let i=0;i<5;i++){

const patch=new THREE.Mesh(new THREE.SphereGeometry(.12,8,8),

new THREE.MeshStandardMaterial({color:0x111111}));

ball.add(patch);

patch.position.set(Math.sin(i*1.2)*.38,Math.cos(i*1.2)*.38,0);

}

ball.position.set(0,.5,-2);

// CONTROL

let mx=0,mz=0,sprinting=false;

const stick=document.getElementById("stick");

const knob=document.getElementById("knob");

let active=false;

function moveStick(e){

const r=stick.getBoundingClientRect();

let dx=e.clientX-r.left-r.width/2;

let dy=e.clientY-r.top-r.height/2;

const max=40;

const d=Math.hypot(dx,dy);

if(d>max){dx*=max/d;dy*=max/d}

knob.style.transform=`translate(${dx}px,${dy}px)`;

mx=dx/max;

mz=dy/max;

}

stick.addEventListener("pointerdown",e=>{

active=true;

stick.setPointerCapture(e.pointerId);

moveStick(e);

});

stick.addEventListener("pointermove",e=>{if(active)moveStick(e)});

function reset(){

active=false;mx=0;mz=0;

knob.style.transform="translate(0px,0px)";

}

stick.addEventListener("pointerup",reset);

stick.addEventListener("pointercancel",reset);

const sprintBtn=document.getElementById("sprint");

sprintBtn.addEventListener("pointerdown",e=>{e.preventDefault();sprinting=true});

sprintBtn.addEventListener("pointerup",()=>sprinting=false);

sprintBtn.addEventListener("pointercancel",()=>sprinting=false);

sprintBtn.addEventListener("pointerleave",()=>sprinting=false);

// Ball physics

let velocity=new THREE.Vector3();

let lastKick=0;

function kick(power){

const now=Date.now();

if(now-lastKick<400)return;

lastKick=now;

const forward=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);

const dist=player.position.distanceTo(ball.position);

if(dist>4)return;

velocity.copy(forward.multiplyScalar(power));

velocity.y=power*.24;

document.getElementById("message").innerText=power>12?"SHOT!":"PASS!";

}

// SHOOT

document.getElementById("shoot").addEventListener("pointerdown",e=>{

e.preventDefault();kick(20);

});

// PASS

document.getElementById("pass").addEventListener("pointerdown",e=>{

e.preventDefault();kick(9);

});

// TIMER

let gameTime=0;

let homeScore=0,awayScore=0;

let goalCooldown=0;

const clock=new THREE.Clock();

// Reset ball

function resetBall(){

ball.position.set(player.position.x,.5,player.position.z-2);

velocity.set(0,0,0);

player.position.set(0,0,20);

}

// Animation

function animate(){

requestAnimationFrame(animate);

const dt=Math.min(clock.getDelta(),.04);

gameTime+=dt;

goalCooldown-=dt;

document.getElementById("timer").innerText=

String(Math.floor(gameTime/60)).padStart(2,"0")+":"+

String(Math.floor(gameTime%60)).padStart(2,"0");

const speed=sprinting?12:7;

if(mx||mz){

const dir=new THREE.Vector3(mx,0,mz).normalize();

player.position.add(dir.multiplyScalar(speed*dt));

player.rotation.y=Math.atan2(dir.x,dir.z);

// Animate legs

playerObj.legs[0].rotation.x=Math.sin(gameTime*12)*.6;

playerObj.legs[1].rotation.x=-Math.sin(gameTime*12)*.6;

playerObj.arms[0].rotation.x=-Math.sin(gameTime*12)*.4;

playerObj.arms[1].rotation.x=Math.sin(gameTime*12)*.4;

}else{

playerObj.legs[0].rotation.x=0;

playerObj.legs[1].rotation.x=0;

}

// Boundaries

player.position.x=Math.max(-28,Math.min(28,player.position.x));

player.position.z=Math.max(-53,Math.min(53,player.position.z));

// Ball

ball.position.add(velocity.clone().multiplyScalar(dt));

velocity.y-=9.8*dt;

if(ball.position.y<.5){

ball.position.y=.5;

velocity.y=Math.abs(velocity.y)*.4;

if(velocity.y<1)velocity.y=0;

}

velocity.x*=.985;

velocity.z*=.985;

// Dribble

const forward=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);

const target=player.position.clone().add(forward.multiplyScalar(1.6));

target.y=.5;

if(ball.position.distanceTo(target)<2 && velocity.length()<3){

ball.position.lerp(target,.15);

}

// Opponents AI

opponents.forEach((o,i)=>{

const targetPos=ball.position.clone();

targetPos.x+=i%2?4:-4;

targetPos.z+=i*2;

const delta=targetPos.sub(o.group.position);

delta.y=0;

if(delta.length()>1){

delta.normalize();

o.group.position.add(delta.multiplyScalar(2*dt));

o.group.rotation.y=Math.atan2(delta.x,delta.z);

}

});

// Keeper

keeper.position.x=Math.sin(gameTime*1.8)*5;

keeper.position.z=-49;

keeper.rotation.y=0;

// Goal detection

if(goalCooldown<=0 && ball.position.z<-55 && Math.abs(ball.position.x)<7){

awayScore++;

document.getElementById("score").innerText=homeScore+" - "+awayScore;

document.getElementById("message").innerText="GOAL!";

goalCooldown=2;

resetBall();

}

if(goalCooldown<=0 && ball.position.z>55 && Math.abs(ball.position.x)<7){

homeScore++;

document.getElementById("score").innerText=homeScore+" - "+awayScore;

document.getElementById("message").innerText="GOAL!";

goalCooldown=2;

resetBall();

}

// Camera

const camOffset=new THREE.Vector3(0,8,12).applyQuaternion(player.quaternion);

camera.position.lerp(player.position.clone().add(camOffset),.08);

camera.lookAt(player.position.x,player.position.y+1,player.position.z-3);

renderer.render(scene,camera);

}

animate();

document.getElementById("loading").style.display="none";

addEventListener("resize",()=>{

camera.aspect=innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(innerWidth,innerHeight);

});

</script>

</body>

</html>
